<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Özel Asistan ve Hatırlatıcı</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col justify-between">

    <!-- Giriş Ekranı -->
    <div id="loginScreen" class="fixed inset-0 bg-gray-950 flex items-center justify-center z-50 p-4">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">Özel Alan Girişi</h2>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Kullanıcı Adı</label>
                    <input type="text" id="loginUser" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Şifre</label>
                    <input type="password" id="loginPass" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl transition">Giriş Yap</button>
            </form>
            <p id="loginError" class="text-red-400 text-sm mt-3 text-center hidden">Hatalı kullanıcı adı veya şifre!</p>
        </div>
    </div>

    <!-- Şifre Değiştirme Ekranı (İlk Giriş İçin) -->
    <div id="changePasswordScreen" class="fixed inset-0 bg-gray-950 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl w-full max-w-sm shadow-2xl">
            <h2 class="text-2xl font-bold mb-2 text-center text-amber-400">Şifre Değiştirme</h2>
            <p class="text-xs text-gray-400 mb-6 text-center">İlk girişinizde güvenliğiniz için şifrenizi değiştirmeniz gerekmektedir.</p>
            <form onsubmit="handlePasswordChange(event)" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Yeni Şifre</label>
                    <input type="password" id="newPass" required class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500">
                </div>
                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-2.5 rounded-xl transition">Şifreyi Güncelle</button>
            </form>
        </div>
    </div>

    <!-- Ana Uygulama -->
    <div id="appContainer" class="hidden flex-1 flex flex-col">
        <!-- Üst Bar -->
        <header class="bg-gray-900/80 backdrop-blur border-b border-gray-800 px-4 py-3 flex justify-between items-center sticky top-0 z-40">
            <h1 class="font-bold text-lg text-indigo-400">Özel Portal</h1>
            <div class="flex items-center gap-3">
                <span id="currentUsernameDisplay" class="text-xs bg-gray-800 px-3 py-1 rounded-full text-gray-300"></span>
                <button onclick="logout()" class="text-gray-400 hover:text-red-400 text-sm"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <!-- İçerik Alanı -->
        <main class="flex-1 max-w-2xl w-full mx-auto p-4 space-y-6">
            
            <!-- Admin Kullanıcı Yönetimi Paneli (Sadece Armo Görür) -->
            <div id="adminPanel" class="hidden bg-gray-800/50 border border-gray-700 p-4 rounded-2xl space-y-4">
                <h3 class="font-semibold text-indigo-300 flex items-center gap-2"><i class="fa-solid fa-users-gear"></i> Kullanıcı Yönetimi (Admin)</h3>
                <form onsubmit="addNewUser(event)" class="flex gap-2">
                    <input type="text" id="newUserName" placeholder="Yeni Kullanıcı Adı" required class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <input type="text" id="newUserPass" placeholder="Geçici Şifre" required class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm transition">Ekle</button>
                </form>
                <div id="userList" class="space-y-2 mt-2"></div>
            </div>

            <!-- Yapay Zeka Sohbet Alanı -->
            <div class="bg-gray-800/50 border border-gray-700 rounded-2xl p-4 flex flex-col h-80">
                <h3 class="font-semibold text-sm text-gray-400 mb-3 flex items-center gap-2"><i class="fa-solid fa-robot"></i> Asistan Sohbeti</h3>
                <div id="chatMessages" class="flex-1 overflow-y-auto space-y-3 pr-2 text-sm">
                    <div class="bg-gray-700/50 p-3 rounded-xl max-w-[80%]">Merhaba! Size nasıl yardımcı olabilirim?</div>
                </div>
                <form onsubmit="handleChat(event)" class="mt-3 flex gap-2">
                    <input type="text" id="chatInput" placeholder="Mesajınızı yazın..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl transition"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>

            <!-- Paylaşımlı Hatırlatıcı Listesi -->
            <div class="bg-gray-800/50 border border-gray-700 rounded-2xl p-4 space-y-4">
                <h3 class="font-semibold text-sm text-gray-400 flex items-center gap-2"><i class="fa-solid fa-list-check"></i> Ortak Hatırlatıcılar</h3>
                <form onsubmit="addReminder(event)" class="flex gap-2">
                    <input type="text" id="reminderInput" placeholder="Yeni hatırlatıcı ekle..." class="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl transition"><i class="fa-solid fa-plus"></i></button>
                </form>
                <ul id="reminderList" class="space-y-2"></ul>
            </div>

        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('portal_users')) || [
            { username: "Armo", password: "Bragovich", mustChangePass: false, isAdmin: true }
        ];

        let reminders = JSON.parse(localStorage.getItem('portal_reminders')) || [];
        let currentUser = JSON.parse(localStorage.getItem('portal_current_user')) || null;

        window.onload = function() {
            if (currentUser) {
                document.getElementById('loginScreen').classList.add('hidden');
                if (currentUser.mustChangePass) {
                    document.getElementById('changePasswordScreen').classList.remove('hidden');
                } else {
                    initApp();
                }
            }
        };

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value;

            let foundUser = users.find(x => x.username.toLowerCase() === u.toLowerCase() && x.password === p);

            if (foundUser) {
                currentUser = foundUser;
                localStorage.setItem('portal_current_user', JSON.stringify(currentUser));
                document.getElementById('loginScreen').classList.add('hidden');
                
                if (currentUser.mustChangePass) {
                    document.getElementById('changePasswordScreen').classList.remove('hidden');
                } else {
                    initApp();
                }
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function handlePasswordChange(e) {
            e.preventDefault();
            const newP = document.getElementById('newPass').value;
            if (!newP) return;

            users = users.map(u => {
                if (u.username === currentUser.username) {
                    u.password = newP;
                    u.mustChangePass = false;
                    currentUser = u;
                }
                return u;
            });

            localStorage.setItem('portal_users', JSON.stringify(users));
            localStorage.setItem('portal_current_user', JSON.stringify(currentUser));

            document.getElementById('changePasswordScreen').classList.add('hidden');
            initApp();
        }

        function initApp() {
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('currentUsernameDisplay').innerText = currentUser.username;
            
            if (currentUser.isAdmin || currentUser.username.toLowerCase() === "armo") {
                document.getElementById('adminPanel').classList.remove('hidden');
                renderUserList();
            }
            renderReminders();
        }

        function logout() {
            localStorage.removeItem('portal_current_user');
            location.reload();
        }

        function addNewUser(e) {
            e.preventDefault();
            const name = document.getElementById('newUserName').value.trim();
            const pass = document.getElementById('newUserPass').value;

            if (users.some(u => u.username.toLowerCase() === name.toLowerCase())) {
                alert("Bu kullanıcı adı zaten var!");
                return;
            }

            users.push({ username: name, password: pass, mustChangePass: true, isAdmin: false });
            localStorage.setItem('portal_users', JSON.stringify(users));

            document.getElementById('newUserName').value = '';
            document.getElementById('newUserPass').value = '';
            renderUserList();
            alert("Kullanıcı başarıyla eklendi. İlk girişinde şifre değiştirmesi gerekecek.");
        }

        function renderUserList() {
            const list = document.getElementById('userList');
            list.innerHTML = '';
            users.forEach(u => {
                if(u.username !== "Armo") {
                    list.innerHTML += `<div class="flex justify-between items-center bg-gray-900 px-3 py-2 rounded-xl text-sm">
                        <span>${u.username} ${u.mustChangePass ? '<span class="text-xs text-amber-400">(Şifre bekleniyor)</span>' : ''}</span>
                        <button onclick="deleteUser('${u.username}')" class="text-red-400 hover:text-red-300 text-xs"><i class="fa-solid fa-trash"></i></button>
                    </div>`;
                }
            });
        }

        function deleteUser(name) {
            users = users.filter(u => u.username !== name);
            localStorage.setItem('portal_users', JSON.stringify(users));
            renderUserList();
        }

        function addReminder(e) {
            e.preventDefault();
            const text = document.getElementById('reminderInput').value.trim();
            if(!text) return;
            reminders.push({ text, by: currentUser.username });
            localStorage.setItem('portal_reminders', JSON.stringify(reminders));
            document.getElementById('reminderInput').value = '';
            renderReminders();
        }

        function renderReminders() {
            const list = document.getElementById('reminderList');
            list.innerHTML = '';
            reminders.forEach((r, idx) => {
                list.innerHTML += `<li class="bg-gray-900 p-3 rounded-xl flex justify-between items-center text-sm">
                    <span>${r.text} <span class="text-xs text-gray-500">(${r.by})</span></span>
                    <button onclick="deleteReminder(${idx})" class="text-gray-500 hover:text-red-400"><i class="fa-solid fa-xmark"></i></button>
                </li>`;
            });
        }

        function deleteReminder(idx) {
            reminders.splice(idx, 1);
            localStorage.setItem('portal_reminders', JSON.stringify(reminders));
            renderReminders();
        }

        function handleChat(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(!msg) return;

            const chatBox = document.getElementById('chatMessages');
            chatBox.innerHTML += `<div class="bg-indigo-600/50 p-3 rounded-xl max-w-[80%] ml-auto">${msg}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            setTimeout(() => {
                chatBox.innerHTML += `<div class="bg-gray-700/50 p-3 rounded-xl max-w-[80%]">Harika bir soru! Bunu not ettim.</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
