<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Hatırlatıcı Asistanı</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans">
    <div id="app" class="flex-1 flex flex-col max-w-md w-full mx-auto p-4 justify-between">
        <div id="view-container" class="flex-1 flex flex-col justify-center">
            
            <!-- GİRİŞ & KAYIT -->
            <div id="auth-view" class="bg-slate-900 p-6 rounded-2xl shadow-xl border border-slate-800">
                <div class="text-center mb-6">
                    <div class="inline-block p-3 bg-indigo-600/20 text-indigo-400 rounded-full mb-3 text-2xl">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <h1 class="text-2xl font-bold">Özel Asistan</h1>
                    <p class="text-sm text-slate-400 mt-1">Armo & Arkadaşları</p>
                </div>
                <div class="space-y-4">
                    <input type="text" id="username-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500" placeholder="Kullanıcı Adı">
                    <input type="password" id="password-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500" placeholder="Şifre">
                    <div id="auth-error" class="text-rose-400 text-xs text-center hidden"></div>
                    <button onclick="handleLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3 rounded-xl text-sm transition">Giriş Yap</button>
                    <button onclick="handleRegisterRequest()" class="w-full bg-slate-800 hover:bg-slate-700 font-semibold py-3 rounded-xl text-sm transition border border-slate-700">Kayıt Ol / İstek Gönder</button>
                </div>
            </div>

            <!-- ONAY BEKLİYOR -->
            <div id="pending-view" class="bg-slate-900 p-6 rounded-2xl shadow-xl border border-slate-800 text-center hidden">
                <div class="inline-block p-4 bg-amber-500/20 text-amber-400 rounded-full mb-4 text-3xl">
                    <i class="fa-solid fa-hourglass-half animate-pulse"></i>
                </div>
                <h2 class="text-xl font-bold mb-2">Onay Bekleniyor</h2>
                <p class="text-sm text-slate-400 mb-6">İsteğiniz yöneticiye (Armo) iletildi.</p>
                <button onclick="showAuthView()" class="text-sm text-indigo-400 hover:underline">Giriş Ekranına Dön</button>
            </div>

            <!-- ADMIN PANELİ (Armo / Bragovich) -->
            <div id="admin-view" class="hidden flex-col h-[80vh] space-y-4">
                <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-800">
                    <h2 class="font-bold text-indigo-400"><i class="fa-solid fa-shield-halved mr-2"></i>Admin Paneli</h2>
                    <button onclick="logout()" class="bg-rose-500/10 text-rose-400 px-3 py-1.5 rounded-lg text-xs font-semibold">Çıkış</button>
                </div>
                <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 flex-1 overflow-y-auto">
                    <h3 class="text-sm font-bold text-slate-300 mb-3">Onay Bekleyenler</h3>
                    <div id="pending-users-list" class="space-y-2"></div>
                </div>
                <button onclick="switchToMainApp()" class="w-full bg-slate-800 hover:bg-slate-700 py-3 rounded-xl text-sm font-semibold border border-slate-700">Asistan Ekranına Geç</button>
            </div>

            <!-- ANA UYGULAMA (AI & HATIRLATICI) -->
            <div id="main-app-view" class="hidden flex-col h-[85vh] space-y-3">
                <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <span id="current-user-badge" class="text-xs font-semibold text-slate-300"></span>
                    <div class="flex space-x-2">
                        <button id="tab-ai-btn" onclick="switchTab('ai')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white">Asistan</button>
                        <button id="tab-rem-btn" onclick="switchTab('rem')" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400">Hatırlatıcı</button>
                        <button onclick="logout()" class="p-1.5 text-slate-400 hover:text-rose-400"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                </div>

                <!-- Sohbet -->
                <div id="tab-ai" class="flex-1 flex flex-col bg-slate-900 rounded-xl border border-slate-800 overflow-hidden">
                    <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-3 text-sm">
                        <div class="flex items-start space-x-2">
                            <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-xs shrink-0"><i class="fa-solid fa-robot"></i></div>
                            <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none max-w-[80%] text-slate-200">Selam! Ben asistanınım.</div>
                        </div>
                    </div>
                    <div class="p-3 bg-slate-950 border-t border-slate-800 flex items-center space-x-2">
                        <input type="text" id="chat-input" onkeypress="if(event.key==='Enter')sendChatMessage()" placeholder="Mesaj yaz..." class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <button onclick="sendChatMessage()" class="bg-indigo-600 text-white w-10 h-10 rounded-xl flex items-center justify-center"><i class="fa-solid fa-paper-plane text-xs"></i></button>
                    </div>
                </div>

                <!-- Hatırlatıcılar -->
                <div id="tab-rem" class="flex-1 hidden flex-col bg-slate-900 rounded-xl border border-slate-800 p-4 space-y-3">
                    <h3 class="text-sm font-bold text-slate-300"><i class="fa-solid fa-bell mr-2 text-indigo-400"></i>Ortak Hatırlatıcılar</h3>
                    <div class="flex space-x-2">
                        <input type="text" id="rem-input" placeholder="Hatırlatıcı ekle..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                        <button onclick="addReminder()" class="bg-indigo-600 px-4 py-2 rounded-xl text-sm font-semibold">Ekle</button>
                    </div>
                    <div id="reminders-list" class="flex-1 overflow-y-auto space-y-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ADMIN = { username: "Armo", pass: "Bragovich" };
        const gUsers = () => JSON.parse(localStorage.getItem('u')) || [];
        const sUsers = (u) => localStorage.setItem('u', JSON.stringify(u));
        const gPend = () => JSON.parse(localStorage.getItem('p')) || [];
        const sPend = (p) => localStorage.setItem('p', JSON.stringify(p));
        const gRems = () => JSON.parse(localStorage.getItem('r')) || [];
        const sRems = (r) => localStorage.setItem('r', JSON.stringify(r));
        const gCurr = () => localStorage.getItem('c');
        const sCurr = (c) => localStorage.setItem('c', c);

        window.onload = () => {
            const c = gCurr();
            if (!c) showAuthView();
            else if (c === ADMIN.username) showAdminView();
            else showMainApp(c);
        };

        function showAuthView() {
            sCurr('');
            document.getElementById('auth-view').classList.remove('hidden');
            document.getElementById('pending-view').classList.add('hidden');
            document.getElementById('admin-view').classList.add('hidden');
            document.getElementById('main-app-view').classList.add('hidden');
        }

        function handleLogin() {
            const u = document.getElementById('username-input').value.trim();
            const p = document.getElementById('password-input').value.trim();
            const err = document.getElementById('auth-error');
            if (!u || !p) { err.innerText = "Alanları doldurun."; err.classList.remove('hidden'); return; }
            if (u === ADMIN.username && p === ADMIN.pass) { sCurr(u); showAdminView(); return; }
            const valid = gUsers().find(x => x.username === u && x.pass === p);
            if (valid) { sCurr(u); showMainApp(u); }
            else if (gPend().find(x => x.username === u)) {
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('pending-view').classList.remove('hidden');
            } else { err.innerText = "Hatalı bilgi veya onay bekliyor."; err.classList.remove('hidden'); }
        }

        function handleRegisterRequest() {
            const u = document.getElementById('username-input').value.trim();
            const p = document.getElementById('password-input').value.trim();
            const err = document.getElementById('auth-error');
            if (!u || !p) { err.innerText = "Kullanıcı adı ve şifre girin."; err.classList.remove('hidden'); return; }
            if (u === ADMIN.username) { err.innerText = "Bu isim yöneticiye ait."; err.classList.remove('hidden'); return; }
            let pend = gPend(), users = gUsers();
            if (users.some(x => x.username === u) || pend.some(x => x.username === u)) {
                err.innerText = "Bu isim zaten alınmış veya sırada."; err.classList.remove('hidden'); return;
            }
            pend.push({ username: u, pass: p }); sPend(pend);
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('pending-view').classList.remove('hidden');
        }

        function showAdminView() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('admin-view').classList.remove('hidden');
            document.getElementById('admin-view').classList.add('flex');
            renderPending();
        }

        function renderPending() {
            const list = document.getElementById('pending-users-list');
            const pend = gPend();
            if (!pend.length) { list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Bekleyen yok.</p>`; return; }
            list.innerHTML = pend.map((user, idx) => `
                <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span class="text-sm">${user.username}</span>
                    <div class="space-x-1">
                        <button onclick="approve(${idx})" class="bg-emerald-600 px-3 py-1 rounded-lg text-xs">Onayla</button>
                        <button onclick="reject(${idx})" class="bg-rose-600 px-3 py-1 rounded-lg text-xs">Reddet</button>
                    </div>
                </div>
            `).join('');
        }

        function approve(i) {
            let pend = gPend(), users = gUsers();
            users.push(pend.splice(i, 1)[0]);
            sPend(pend); sUsers(users); renderPending();
        }

        function reject(i) {
            let pend = gPend(); pend.splice(i, 1); sPend(pend); renderPending();
        }

        function logout() { showAuthView(); }
        function switchToMainApp() { showMainApp(ADMIN.username); }

        function showMainApp(u) {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('admin-view').classList.add('hidden');
            document.getElementById('main-app-view').classList.remove('hidden');
            document.getElementById('main-app-view').classList.add('flex');
            document.getElementById('current-user-badge', `Kullanıcı: ${u}`);
            document.getElementById('current-user-badge').innerText = `Kullanıcı: ${u}`;
            renderRems();
        }

        function switchTab(t) {
            const ai = document.getElementById('tab-ai'), rem = document.getElementById('tab-rem');
            const aiB = document.getElementById('tab-ai-btn'), remB = document.getElementById('tab-rem-btn');
            if (t === 'ai') {
                ai.classList.remove('hidden'); ai.classList.add('flex'); rem.classList.add('hidden');
                aiB.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white";
                remB.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400";
            } else {
                ai.classList.add('hidden'); rem.classList.remove('hidden'); rem.classList.add('flex');
                aiB.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400";
                remB.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white";
            }
        }

        function sendChatMessage() {
            const input = document.getElementById('chat-input'), msg = input.value.trim();
            if (!msg) return;
            const chat = document.getElementById('chat-messages');
            chat.innerHTML += `<div class="flex justify-end"><div class="bg-indigo-600 p-3 rounded-2xl max-w-[80%]">${msg}</div></div>`;
            input.value = ''; chat.scrollTop = chat.scrollHeight;
            setTimeout(() => {
                chat.innerHTML += `<div class="flex space-x-2"><div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-xs"><i class="fa-solid fa-robot"></i></div><div class="bg-slate-800 p-3 rounded-2xl max-w-[80%]">Anladım, bunu not aldım!</div></div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 500);
        }

        function addReminder() {
            const input = document.getElementById('rem-input'), text = input.value.trim();
            if (!text) return;
            let r = gRems(); r.push({ text, user: gCurr() }); sRems(r); input.value = ''; renderRems();
        }

        function renderRems() {
            const list = document.getElementById('reminders-list'), r = gRems();
            if (!r.length) { list.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">Hatırlatıcı yok.</p>`; return; }
            list.innerHTML = r.map((x, i) => `
                <div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span class="text-sm">${x.text} <span class="text-[10px] text-slate-400">(${x.user})</span></span>
                    <button onclick="delRem(${i})" class="text-rose-400 text-xs"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        function delRem(i) {
            let r = gRems(); r.splice(i, 1); sRems(r); renderRems();
        }
    </script>
</body>
</html>
